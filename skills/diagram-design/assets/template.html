<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Request processing</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f5f5f5;
        --ink: #2d3142;
        --muted: #4f5d75;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --serif: Georgia, "Times New Roman", serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: clamp(20px, 4vw, 64px);
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
      }
      main {
        max-width: 960px;
        min-width: 0;
        margin-inline: auto;
      }
      h1 {
        margin: 0 0 12px;
        font: 400 clamp(28px, 4vw, 42px)/1.15 var(--serif);
      }
      .intro {
        margin: 0 0 32px;
        max-width: 60ch;
        color: var(--muted);
        line-height: 1.5;
      }
      figure {
        margin: 0;
      }
      .viewport {
        overflow-x: auto;
      }
      svg {
        display: block;
        width: 100%;
        min-width: 960px;
        height: auto;
      }
      figcaption {
        margin-top: 20px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }
      @media print {
        body {
          padding: 0;
        }
        svg {
          min-width: 0;
        }
        .viewport {
          overflow: visible;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Request processing</h1>
      <p class="intro">A request is validated before its result is saved.</p>
      <figure>
        <div
          class="viewport"
          tabindex="0"
          role="region"
          aria-label="Request processing diagram; scroll horizontally on small screens"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="960"
            height="280"
            viewBox="0 0 960 280"
            role="img"
            aria-labelledby="request-title request-desc"
          >
            <title id="request-title">Request processing</title>
            <desc id="request-desc">
              A client sends a request to a service, which validates it and saves the result in a
              store.
            </desc>
            <defs>
              <marker
                id="request-arrow"
                markerWidth="8"
                markerHeight="6"
                refX="7"
                refY="3"
                orient="auto-start-reverse"
              >
                <path d="M0 0 L8 3 L0 6 Z" fill="#4f5d75" />
              </marker>
            </defs>
            <rect width="960" height="280" fill="#f5f5f5" />
            <g fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#request-arrow)">
              <path d="M240 140 H380" />
              <path d="M580 140 H720" />
            </g>
            <g stroke-width="1.2">
              <rect x="40" y="90" width="200" height="100" rx="6" fill="#f5f5f5" stroke="#2d3142" />
              <rect
                x="380"
                y="90"
                width="200"
                height="100"
                rx="6"
                fill="#fae9df"
                stroke="#eb6c36"
              />
              <rect
                x="720"
                y="90"
                width="200"
                height="100"
                rx="6"
                fill="#ececec"
                stroke="#4f5d75"
              />
            </g>
            <g
              fill="#2d3142"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="22"
              font-weight="600"
              text-anchor="middle"
            >
              <text x="140" y="148">Client</text>
              <text x="480" y="137">Service</text>
              <text x="820" y="148">Store</text>
            </g>
            <g
              fill="#4f5d75"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="16"
              text-anchor="middle"
            >
              <text x="310" y="122">sends</text>
              <text x="650" y="122">saves</text>
              <text x="480" y="165">validates request</text>
            </g>
          </svg>
        </div>
        <figcaption>
          The service is emphasized because it owns validation. Replace this example's content with
          the requested subject.
        </figcaption>
      </figure>
    </main>
  </body>
</html>
