packages:
  - "."
  - "pi/packages/*"
  - "pi/extensions/*"
  - "pi/extensions/experimental/*"

catalogMode: prefer

overrides:
  "@earendil-works/chord": "catalog:"
  "@earendil-works/pi-agent-core": "catalog:"
  "@earendil-works/pi-ai": "catalog:"
  "@earendil-works/pi-client": "catalog:"
  "@earendil-works/pi-coding-agent": "catalog:"
  "@earendil-works/pi-protocol": "catalog:"
  "@earendil-works/pi-server": "catalog:"
  "@earendil-works/pi-telemetry": "catalog:"
  "@earendil-works/pi-tui": "catalog:"
  "typebox": "1.3.14"
  vite@*: "catalog:"
catalog:
  "@earendil-works/chord": 0.87.0
  "@earendil-works/pi-agent-core": 0.87.0
  "@earendil-works/pi-ai": 0.87.0
  "@earendil-works/pi-client": 0.87.0
  "@earendil-works/pi-coding-agent": 0.87.0
  "@earendil-works/pi-protocol": 0.87.0
  "@earendil-works/pi-server": 0.87.0
  "@earendil-works/pi-telemetry": 0.87.0
  "@earendil-works/pi-tui": 0.87.0
  "@types/node": 26.6.2
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vite-plus: 0.3.3
  "@oxlint/plugins": 1.78.0
  safe-stable-stringify: 2.5.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  "@google/genai": true
  esbuild: true
  protobufjs: true
minimumReleaseAgeExclude:
  - "@earendil-works/chord@0.87.0"
  - "@earendil-works/pi-agent-core@0.87.0"
  - "@earendil-works/pi-ai@0.87.0"
  - "@earendil-works/pi-client@0.87.0"
  - "@earendil-works/pi-coding-agent@0.87.0"
  - "@earendil-works/pi-protocol@0.87.0"
  - "@earendil-works/pi-server@0.87.0"
  - "@earendil-works/pi-telemetry@0.87.0"
  - "@earendil-works/pi-tui@0.87.0"
  - "@types/node@26.6.2"

# Pi 0.87.0's public SDK imports its server package without declaring it.
packageExtensions:
  "@earendil-works/pi-coding-agent@0.87.0":
    dependencies:
      "@earendil-works/pi-server": "0.87.0"
