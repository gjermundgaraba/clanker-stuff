packages:
  - "."
  - "pi/packages/*"
  - "pi/extensions/*"
  - "pi/extensions/experimental/*"
  - "pi/lab/*"
  - "pi/evals/runtime"
  - "skills/*"

catalogMode: prefer
saveExact: true

overrides:
  "@earendil-works/pi-agent-core": "catalog:"
  "@earendil-works/pi-ai": "catalog:"
  "@earendil-works/pi-codemode": "catalog:"
  "@earendil-works/pi-mcp": "catalog:"
  "@earendil-works/pi-coding-agent": "catalog:"
  "@earendil-works/pi-telemetry": "catalog:"
  "@earendil-works/pi-tui": "catalog:"
  "typebox": "catalog:"
  vite@*: "catalog:"
  vitest@*: "catalog:"
catalog:
  "@earendil-works/pi-agent-core": 1.4.0
  "@earendil-works/pi-ai": 1.4.0
  "@earendil-works/pi-codemode": 1.4.0
  "@earendil-works/pi-mcp": 1.4.0
  "@earendil-works/pi-coding-agent": 1.4.0
  "@earendil-works/pi-telemetry": 1.4.0
  "@earendil-works/pi-tui": 1.4.0
  "@types/node": 26.6.5
  typebox: 1.4.3
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  "@google/genai": true
  esbuild: true
  protobufjs: true
# Registry releases wait one day unless explicitly approved below.
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - "@gjermundgaraba/*"
  - "@gjermundgaraba-designs/*"
  - "@effect/*"
  - "@pierre/highlights@0.2.0"
