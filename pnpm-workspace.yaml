packages:
  - "."
  - "pi/packages/*"
  - "pi/extensions/*"
  - "pi/extensions/experimental/*"

catalogMode: prefer

overrides:
  "@earendil-works/pi-agent-core": "0.84.2"
  "@earendil-works/pi-ai": "0.84.2"
  "@earendil-works/pi-coding-agent": "0.84.2"
  "@earendil-works/pi-tui": "0.84.2"
  "typebox": "1.3.14"
  vite: "catalog:"
  vitest: "catalog:"
catalog:
  "@types/node": 26.2.0
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vitest: 4.1.10
  vite-plus: 0.2.9
  oxlint: 1.78.0
  "@oxlint/plugins": 1.78.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  "@google/genai": true
  protobufjs: true
