packages:
  - "."
  - "pi/packages/*"
  - "pi/extensions/*"
  - "pi/extensions/experimental/*"
  - "pi/evals/runtime"
  - "skills/*"

catalogMode: prefer

overrides:
  "@earendil-works/pi-agent-core": "catalog:"
  "@earendil-works/pi-ai": "catalog:"
  "@earendil-works/pi-codemode": "catalog:"
  "@earendil-works/pi-mcp": "catalog:"
  "@earendil-works/pi-coding-agent": "catalog:"
  "@earendil-works/pi-telemetry": "catalog:"
  "@earendil-works/pi-tui": "catalog:"
  "typebox": "catalog:"
  vite@*: "catalog:"
catalog:
  "@earendil-works/pi-agent-core": 1.2.0
  "@earendil-works/pi-ai": 1.2.0
  "@earendil-works/pi-codemode": 1.2.0
  "@earendil-works/pi-mcp": 1.2.0
  "@earendil-works/pi-coding-agent": 1.2.0
  "@earendil-works/pi-telemetry": 1.2.0
  "@earendil-works/pi-tui": 1.2.0
  "@types/node": 26.6.4
  typebox: 1.3.36
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  "@google/genai": true
  esbuild: true
  protobufjs: true
minimumReleaseAgeExcludePrune: true
