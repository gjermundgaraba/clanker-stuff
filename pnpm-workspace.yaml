packages:
  - "."
  - "packages/*"
  - "pi/packages/*"
  - "pi/extensions/*"
  - "pi/extensions/experimental/*"
  - "pi/lab/*"
  - "pi/evals/runtime"
  - "skills/*"

catalogMode: prefer
saveExact: true

overrides:
  "@earendil-works/pi-agent-core": "catalog:"
  "@earendil-works/pi-ai": "catalog:"
  "@earendil-works/pi-codemode": "catalog:"
  "@earendil-works/pi-mcp": "catalog:"
  "@earendil-works/pi-schema": "catalog:"
  "@earendil-works/pi-coding-agent": "catalog:"
  "@earendil-works/pi-telemetry": "catalog:"
  "@earendil-works/pi-tui": "catalog:"
  "typebox": "catalog:"
  vite@*: "catalog:"
catalog:
  "@earendil-works/pi-agent-core": 1.5.0
  "@earendil-works/pi-ai": 1.5.0
  "@earendil-works/pi-codemode": 1.5.0
  "@earendil-works/pi-mcp": 1.5.0
  "@earendil-works/pi-schema": 1.5.0
  "@earendil-works/pi-coding-agent": 1.5.0
  "@earendil-works/pi-telemetry": 1.5.0
  "@earendil-works/pi-tui": 1.5.0
  "@effect/tsgo": 0.67.3
  "@types/node": 26.6.6
  typebox: 1.4.3
  typescript: 7.0.2
  ultracite: 8.1.1
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
  xstate: 6.0.0-alpha.71
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  "@google/genai": true
  esbuild: true
  protobufjs: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - "@gjermundgaraba/*"
  - "@gjermundgaraba-designs/*"
  - effect
  - "@effect/*"
  # Pi publishes its packages in lockstep and the catalog pins them exactly, so a bump is always deliberate.
  - "@earendil-works/*"
permissions:
  ultracite:
    skills: true
skills:
  dirs:
    - .agents/skills
    - .claude/skills
