name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          cache-toolchain: true
          run-install: false
      - run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: vp install --frozen-lockfile
      - run: vp run ready
      - name: Check that the build left the tree clean
        run: git diff --exit-code
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --project pi/evals --frozen
      - run: |
          for tests in pi/evals/tests pi/evals/suites/*/tests; do
            PYTHONPATH=pi/evals uv run --project pi/evals python -m unittest discover -s "$tests" -p 'test_*.py' -v
          done
      - run: |
          for profile in profiles/*.yaml; do
            uv run harbor job start --config "$profile" --path suites/compaction/tasks --print-config >/dev/null
          done
          for config in suites/*/job.yaml; do
            uv run harbor job start --config "$config" --print-config >/dev/null
          done
        working-directory: pi/evals
