job_name: code-mode
jobs_dir: .harbor/jobs
n_attempts: 1
n_concurrent_trials: 1
quiet: false
environment:
  type: docker
  delete: true
agents:
  - import_path: pi_evals.adapters.pi:PiEval
    model_name: &comparison_model openai/gpt-6.1-sol
    kwargs:
      thinking: &comparison_thinking high
      settings:
        compaction:
          enabled: false
        retry:
          enabled: false
      pi_evals:
        experiment: code-mode
        direct_tools: &direct_tools [bash, edit, read, write]
        arm: direct
        tool_mode: direct
        pair_id: calibration
        platform: pi-without-code-mode
        compaction_mode: "off"
        expected_mechanism: pi-builtin
        expected_protocol: null
  - import_path: pi_evals.adapters.pi:PiEval
    model_name: *comparison_model
    kwargs:
      thinking: *comparison_thinking
      settings:
        compaction:
          enabled: false
        retry:
          enabled: false
      pi_evals:
        experiment: code-mode
        direct_tools: *direct_tools
        arm: code
        tool_mode: code_mode_only
        pair_id: calibration
        platform: pi-with-code-mode
        compaction_mode: "off"
        expected_mechanism: pi-builtin
        expected_protocol: null
