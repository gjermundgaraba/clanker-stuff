schema_version = "1.4"

[task]
name = "pi-evals/read-write-tools"
description = "Use Pi's read and write tools to transfer an exact value."
keywords = ["tools", "read", "write"]

[metadata]
difficulty = "easy"
category = "tool-use"
tags = ["tools", "trajectory"]

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 120.0

[environment]
docker_image = "clanker-pi-evals:node24"
workdir = "/app"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 10240
gpus = 0
