schema_version = "1.4"
multi_step_reward_strategy = "final"

[task]
name = "pi-evals/compaction-debugging-continuity"
description = "Retain a failed attempt, observed regression, hypothesis, API contract, and next action across compaction."
keywords = ["compaction", "multi-step", "debugging"]

[metadata]
difficulty = "hard"
category = "context-management"
tags = ["compaction", "trajectory", "debugging"]

[environment]
docker_image = "clanker-pi-evals:node24"
workdir = "/app"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 10240
gpus = 0

[[steps]]
name = "failed-attempt"
[steps.agent]
timeout_sec = 300.0
[steps.verifier]
timeout_sec = 60.0

[[steps]]
name = "observed-regression"
[steps.agent]
timeout_sec = 300.0
[steps.verifier]
timeout_sec = 60.0

[[steps]]
name = "hypothesis"
[steps.agent]
timeout_sec = 300.0
[steps.verifier]
timeout_sec = 60.0

[[steps]]
name = "api-contract"
[steps.agent]
timeout_sec = 300.0
[steps.verifier]
timeout_sec = 60.0

[[steps]]
name = "next-action"
[steps.agent]
timeout_sec = 300.0
[steps.verifier]
timeout_sec = 60.0

[[steps]]
name = "pressure-a"
[steps.agent]
timeout_sec = 600.0
[steps.verifier]
timeout_sec = 60.0

[[steps]]
name = "pressure-b"
[steps.agent]
timeout_sec = 600.0
[steps.verifier]
timeout_sec = 60.0

[[steps]]
name = "pressure"
[steps.agent]
timeout_sec = 600.0
[steps.verifier]
timeout_sec = 60.0

[[steps]]
name = "implement"
[steps.agent]
timeout_sec = 600.0
[steps.verifier]
timeout_sec = 120.0
