job_name: compaction-matrix
jobs_dir: .harbor/jobs
n_attempts: 3

orchestrator:
  type: local
  n_concurrent_trials: 4
  quiet: false

environment:
  type: docker
  delete: true

agents:
  - import_path: pi_evals.pi:PiEval
    model_name: openai-codex/gpt-5.6-terra
    resume_trajectory: true
    kwargs:
      agent_label: pi-no-compaction
      version: 0.84.1
      thinking: medium
      settings:
        compaction:
          enabled: false

  - import_path: pi_evals.pi:PiEval
    model_name: openai-codex/gpt-5.6-terra
    resume_trajectory: true
    kwargs:
      agent_label: pi-builtin
      version: 0.84.1
      thinking: medium
      settings:
        compaction:
          enabled: true
          reserveTokens: 247000
          keepRecentTokens: 1000

  - import_path: pi_evals.pi:PiEval
    model_name: openai-codex/gpt-5.6-terra
    resume_trajectory: true
    kwargs:
      agent_label: pi-codex-provider
      version: 0.84.1
      thinking: medium
      extensions:
        - /opt/codex-provider/index.ts
      settings:
        compaction:
          enabled: true
          reserveTokens: 247000
          keepRecentTokens: 1000

  - import_path: pi_evals.codex:CodexEval
    model_name: openai/gpt-5.6-terra
    resume_trajectory: true
    kwargs:
      agent_label: codex-cli
      version: 0.147.0
      reasoning_effort: medium
      config:
        model_auto_compact_token_limit: 45000

datasets:
  - path: datasets/compaction
