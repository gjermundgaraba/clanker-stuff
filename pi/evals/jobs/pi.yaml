job_name: pi-evals
jobs_dir: .harbor/jobs
n_attempts: 1

orchestrator:
  type: local
  n_concurrent_trials: 2
  quiet: false

environment:
  type: docker
  delete: true

agents:
  - import_path: pi_evals.pi:PiEval
    model_name: openai-codex/gpt-5.6-terra
    kwargs:
      agent_label: pi-builtin
      version: 0.84.1
      thinking: medium

datasets:
  - path: datasets/coding
  - path: datasets/tool-use
