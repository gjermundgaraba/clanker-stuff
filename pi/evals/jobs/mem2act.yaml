job_name: mem2act
jobs_dir: .harbor/jobs
n_attempts: 3

orchestrator:
  type: local
  n_concurrent_trials: 4
  quiet: false

environment:
  type: docker
  delete: true

agents:
  - import_path: pi_evals.pi:PiEval
    model_name: openai-codex/gpt-5.6-terra
    kwargs:
      agent_label: pi-vanilla
      thinking: medium
      settings:
        compaction:
          enabled: false

  - import_path: pi_evals.pi:PiEval
    model_name: openai-codex/gpt-5.6-terra
    kwargs:
      agent_label: pi-provider
      thinking: medium
      extensions:
        - /opt/codex-provider/index.ts
      settings:
        compaction:
          enabled: false

  - import_path: pi_evals.codex:CodexEval
    model_name: openai/gpt-5.6-terra
    kwargs:
      agent_label: codex-native
      version: 0.147.0
      reasoning_effort: medium
      config:
        model_auto_compact_token_limit: 1000000000

datasets:
  - path: datasets-generated/mem2act
